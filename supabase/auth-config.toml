project_id = "dalmia-dashboard"

[auth]
site_url = "https://dalmia-blush.vercel.app"
additional_redirect_urls = ["https://dalmia-blush.vercel.app/auth/callback", "https://dalmia-blush.vercel.app/auth/callback?next=/account/password", "https://dalmia-blush.vercel.app/auth/mobile", "http://127.0.0.1:4173/auth/callback", "http://127.0.0.1:4175/auth/callback"]
minimum_password_length = 12
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
